[project]
name = "rofai-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "azure-cognitiveservices-speech>=1.52.0",
    "fastapi>=0.142.2",
    "github-copilot-sdk>=1.0.16",
    "numpy>=2.5.3",
    "openai>=3.26.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
