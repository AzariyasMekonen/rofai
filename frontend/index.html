<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5b800" />
    <title>40 Years · Talk with Tsehay Roschli</title>
  </head>
  <body data-state="idle">
    <div class="tibeb tibeb--top" aria-hidden="true"></div>

    <main id="app" class="app">
      <section class="portrait" aria-label="Animated portrait">
        <div class="halo" aria-hidden="true"></div>
        <canvas id="avatar" aria-label="Animated portrait of our founder"></canvas>
        <div id="status" class="status" aria-hidden="true">
          <span class="status__dot"></span><span id="status-text">Ready</span>
        </div>
        <p id="model-note" class="model-note" hidden></p>
      </section>

      <section class="panel">
        <header class="masthead">
          <div class="seal" aria-hidden="true"><span>40</span></div>
          <div>
            <p id="eyebrow" class="eyebrow">40th Anniversary</p>
            <h1 id="title">Tsehay Roschli</h1>
            <p class="role">Founder</p>
          </div>
        </header>

        <div class="conversation" aria-live="polite">
          <p id="notice" class="notice" role="status" hidden></p>
          <p id="user-caption" class="question"></p>
          <p id="answer-caption" class="answer"></p>
          <p id="welcome" class="welcome">Tap the microphone and ask about the school's story, in English or Amharic.</p>
        </div>

        <div id="suggestions" class="suggestions" aria-label="Suggested questions"></div>

        <div class="controls">
          <div class="lang" role="radiogroup" aria-label="Language">
            <label><input type="radio" name="lang" value="auto" checked /><span>Auto</span></label>
            <label><input type="radio" name="lang" value="en" /><span>English</span></label>
            <label><input type="radio" name="lang" value="am" /><span>አማርኛ</span></label>
            <label><input type="radio" name="lang" value="om" /><span>Oromoo</span></label>
          </div>

          <button id="mic" class="mic" type="button" aria-pressed="false">
            <span class="mic__ring" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"
              />
            </svg>
            <span id="mic-label" class="visually-hidden">Tap to ask</span>
          </button>

          <form id="text-form" class="ask">
            <input id="text-input" maxlength="500" autocomplete="off" placeholder="Or type a question…" aria-label="Your question" />
            <button type="submit" aria-label="Ask">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z" />
              </svg>
            </button>
          </form>
        </div>

        <footer id="disclosure" class="disclosure">
          AI character based on our founder. Answers come from the school archives and may contain mistakes.
        </footer>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
